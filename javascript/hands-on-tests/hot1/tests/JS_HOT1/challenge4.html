<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Challenge 4 - Odd Numbers</title>
</head>
<body>
  <h1>Odd Numbers from 1 to 100</h1>

  <ul id="oddList"></ul>

  <script>
    const oddList = document.getElementById("oddList");

    // Use a for loop to print all odd numbers from 1 to 100
    for (let i = 1; i <= 100; i++) {
      if (i % 2 !== 0) {
        const li = document.createElement("li");
        li.textContent = i;
        oddList.appendChild(li);
      }
    }
  </script>
</body>
</html>
