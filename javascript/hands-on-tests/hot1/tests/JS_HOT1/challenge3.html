<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Challenge 3 – Song Lyrics</title>
</head>
<body>
  <h1>🎵 Song Lyrics Selector</h1>

  <label for="numberInput">Enter a number (1-3):</label>
  <input type="text" id="numberInput" placeholder="Type a number">
  <button id="checkBtn">Show Lyric</button>

  <p id="output"></p>

  <script>
    const numberInput = document.getElementById("numberInput");
    const checkBtn = document.getElementById("checkBtn");
    const output = document.getElementById("output");

    checkBtn.addEventListener("click", function () {
      const value = numberInput.value.trim();

      // Check for string value (non-numeric)
      if (!/^\d+$/.test(value)) {
        output.textContent = "Please enter a number, not a word.";
        return;
      }

      const number = parseInt(value);

      // Match the number to song lyrics
      switch (number) {
        case 1:
          output.textContent = "One is the loneliest number that you'll ever do.";
          break;
        case 2:
          output.textContent = "Two can be as bad as one. It's the loneliest number since the number one.";
          break;
        case 3:
          output.textContent = "There is no three.";
          break;
        default:
          output.textContent = "You didn't enter a valid number.";
      }
    });
  </script>
</body>
</html>
