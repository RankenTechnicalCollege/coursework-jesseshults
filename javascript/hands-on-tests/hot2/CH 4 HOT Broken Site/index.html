<!DOCTYPE html>
<html>

<head>
   <!--
      JavaScript
      Author: Jesse Shults 
      Date:   11/15/2025 
   -->
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Hands-on Project 7-3</title>
   <link rel="stylesheet" href="styles.css">
</head>

<body>
   <header>
      <h1>Hands-on Test Chapter 4</h1>
   </header>

   <article>
      <h2>Steam Game Sale</h2>
      <form>
         <input type="checkbox" id="item1" value="1999">
         <label for="item1">Counter Strike ($19.99)</label>
         <input type="checkbox" id="item2" value="2999">
         <label for="item2">Dark Souls III ($29.99)</label>
         <input type="checkbox" id="item3" value="1349">
         <label for="item3">Enter The Gungeon ($13.49)</label>
         <input type="checkbox" id="item4" value="499">
         <label for="item4">Hover Junkers ($4.99)</label>
         <input type="checkbox" id="item5" value="899"> <!-- FIXED value from 599 to 899 -->
         <label for="item5">Good Robot ($8.99)</label>
         <input type="button" value="Calculate" id="sButton">
      </form>

      <table>
         <colgroup>
            <col class="label">
            <col class="amount">
         </colgroup>
         <tbody>
            <tr>
               <td>Item total</td>
               <td>0.00</td>
            </tr>
            <tr>
               <td>Tax</td>
               <td>0.00</td>
            </tr>
            <tr>
               <td>Total with tax</td>
               <td>$0.00</td>
            </tr>
         </tbody>
      </table>
   </article>

   <script>
      "use strict";

      // Function to add values of selected checkboxes and display totals
      function calcTotal() {
         let itemTotal = 0;
         let tax = 0;
         let totalWithTax = 0;

         let items = document.getElementsByTagName("input");
         let cells = document.getElementsByTagName("td");

         for (let i = 0; i < items.length; i++) {
            if (items[i].type === "checkbox" && items[i].checked) {
               itemTotal += parseInt(items[i].value);
            }
         }

         tax = itemTotal * 0.05;
         totalWithTax = itemTotal + tax;

         cells[1].innerHTML = (itemTotal / 100).toFixed(2);
         cells[3].innerHTML = (tax / 100).toFixed(2);
         cells[5].innerHTML = "$" + (totalWithTax / 100).toFixed(2);

         // Clear all checkboxes
         for (let i = 0; i < items.length; i++) {
            if (items[i].type === "checkbox") {
               items[i].checked = false;
            }
         }
      }

      // Add event listener to button
      let submitButton = document.getElementById("sButton");
      submitButton.addEventListener("click", calcTotal);

      // Add formatted date to new div
      const today = new Date();
      const dateDiv = document.createElement("div");
      dateDiv.textContent = today.toDateString(); // Format: Sun Nov 16 2025
      document.body.appendChild(dateDiv);
   </script>
</body>

</html>
