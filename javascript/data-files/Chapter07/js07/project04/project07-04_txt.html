<body>
   <header>
      <h1>Hands-on Project 7-4</h1>
   </header>

   <article>
      <h2>Customer Queue</h2>
      
      <section>
         <div id="customerInput">

            <label for="customerName">Customer</label>
            <input type="text" id="customerName" name="customerName">

            <div class="buttonRow">
               <input type="button" id="addButton" value="Add">
               <input type="button" id="searchButton" value="Search">
               <input type="button" id="removeButton" value="Remove">
            </div>

            <p id="status"></p>
         </div>
      
         <div id="customerBox">
            <h3>
               Customer List 
               <input id="topButton" type="button" value="Remove Top Customer">
            </h3>
         
            <ol id="customerList"></ol>
         </div>
      </section>
   </article>
</body>
