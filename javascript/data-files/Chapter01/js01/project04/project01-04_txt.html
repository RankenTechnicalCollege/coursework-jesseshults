<!DOCTYPE html>
<html lang="en">
<head>
   <!--
      JavaScript 7th Edition

      Hands-on Project 1-4

      Author: Jesse Shults

      Filename: index.htm
   -->
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width,initial-scale=1.0">
   <title>Hands-on Project 1-4</title>
   <link rel="stylesheet" href="styles.css">
</head>

<body>
   <!-- ✅ Load variables before using them -->
   <script src="project01-04_txt.js"></script>

   <header>
      <h1>Hands-on Project 1-4</h1>
   </header>

   <article>
      <h2>Shipping Address</h2>

      <form>
         <fieldset id="addroptions">
            <legend><span>Choose an address</span></legend>

            <!-- ✅ Flex container for side-by-side layout -->
            <div class="address-options">

               <!-- Home Option -->
               <label for="homeoption" id="homeaddr">
                  <input type="radio" id="homeoption" name="shippingaddr"
                     onclick="
                        document.getElementById('street').value = homeStreet;
                        document.getElementById('city').value = homeCity;
                        document.getElementById('state').value = homeState;
                        document.getElementById('code').value = homeCode;
                     ">
                  <span><strong>Home</strong></span><br>
                  <span>
                     <script>
                        document.write(homeStreet + "<br>");
                        document.write(homeCity + ", " + homeState + " " + homeCode);
                     </script>
                  </span>
               </label>

               <!-- Work Option -->
               <label for="workoption" id="workaddr">
                  <input type="radio" id="workoption" name="shippingaddr"
                     onclick="
                        document.getElementById('street').value = workStreet;
                        document.getElementById('city').value = workCity;
                        document.getElementById('state').value = workState;
                        document.getElementById('code').value = workCode;
                     ">
                  <span><strong>Work</strong></span><br>
                  <span>
                     <script>
                        document.write(workStreet + "<br>");
                        document.write(workCity + ", " + workState + " " + workCode);
                     </script>
                  </span>
               </label>

            </div>
         </fieldset>

         <fieldset id="contactinfo">
            <label for="street">
               Street Address
               <input type="text" id="street">
            </label>
            <label for="city">
               City
               <input type="text" id="city">
            </label>
            <label for="state">
               State
               <input type="text" id="state">
            </label>
            <label for="code">
               Zip
               <input type="text" id="code">
            </label>
         </fieldset>
      </form>
   </article>
</body>
</html>
