  <title>My Favorite Places</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="index.html">My Favorites</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="books.html">Books</a></li>
          <li class="nav-item"><a class="nav-link" href="movies.html">Movies</a></li>
          <li class="nav-item"><a class="nav-link" href="music.html">Music</a></li>
          <li class="nav-item"><a class="nav-link active" href="places.html">Places</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Gallery -->
  <div class="container my-5">
    <h2 class="text-center mb-4">🌍 My Favorite Places</h2>
    <div class="row g-4">

      <!-- Place 1 -->
      <div class="col-12 col-md-6 col-lg-4">
        <figure>
          <img src="images/trevi-fountian.jpg" class="img-fluid rounded shadow place-img" alt="Trevi Fountain in Rome">
          <figcaption class="text-center mt-2">The famous Trevi Fountain in Rome</figcaption>
        </figure>
      </div>

      <!-- Place 2 -->
      <div class="col-12 col-md-6 col-lg-4">
        <figure>
          <img src="images/olive-garden.jpg" class="img-fluid rounded shadow place-img" alt="Olive Garden Restaurant">
          <figcaption class="text-center mt-2">A cozy meal at Olive Garden</figcaption>
        </figure>
      </div>

      <!-- Place 3 -->
      <div class="col-12 col-md-6 col-lg-4">
        <figure>
          <img src="images/AMC.jpg" class="img-fluid rounded shadow place-img" alt="AMC Movie Theater">
          <figcaption class="text-center mt-2">Catching a movie at AMC Theaters</figcaption>
        </figure>
      </div>

      <!-- Place 4 -->
      <div class="col-12 col-md-6 col-lg-4">
        <figure>
          <img src="images/truman-lake.jpg" class="img-fluid rounded shadow place-img" alt="Truman Lake Missouri">
          <figcaption class="text-center mt-2">Relaxing views at Truman Lake</figcaption>
        </figure>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
