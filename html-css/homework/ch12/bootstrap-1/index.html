<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <form id="order-form" action="/order" method="post" class="container">

    <!-- Contact Information -->
    <fieldset class="mb-4">
      <legend>Contact Information</legend>
      <div class="row g-3">
        <div class="col-md-6">
          <label for="given-name" class="form-label">Given Name</label>
          <input type="text" id="given-name" name="given-name" class="form-control" required autocomplete="given-name">
        </div>
        <div class="col-md-6">
          <label for="family-name" class="form-label">Family Name</label>
          <input type="text" id="family-name" name="family-name" class="form-control" required autocomplete="family-name">
        </div>
        <div class="col-md-6">
          <label for="phone" class="form-label">Phone Number</label>
          <input type="tel" id="phone" name="phone" class="form-control" required autocomplete="tel">
        </div>
        <div class="col-md-6">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" required autocomplete="email">
        </div>
        <div class="col-md-6">
          <label for="confirm-email" class="form-label">Confirm Email</label>
          <input type="email" id="confirm-email" name="confirm-email" class="form-control" required autocomplete="email">
        </div>
      </div>
    </fieldset>

    <!-- Account Credentials -->
    <fieldset class="mb-4">
      <legend>Account Credentials</legend>
      <div class="row g-3">
        <div class="col-md-6">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-control" required autocomplete="new-password">
        </div>
        <div class="col-md-6">
          <label for="confirm-password" class="form-label">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirm-password" class="form-control" required autocomplete="new-password">
        </div>
      </div>
    </fieldset>

    <!-- Payment Information -->
    <fieldset class="mb-4">
      <legend>Payment Information</legend>
      <div class="row g-3">
        <div class="col-md-6">
          <label for="card-number" class="form-label">Credit Card Number</label>
          <input type="text" id="card-number" name="card-number" class="form-control" required autocomplete="cc-number">
        </div>
        <div class="col-md-3">
          <label for="expiration" class="form-label">Expiration Date (MM/YY)</label>
          <input type="text" id="expiration" name="expiration" class="form-control" required autocomplete="cc-exp">
        </div>
        <div class="col-md-3">
          <label for="csc" class="form-label">CSC Code</label>
          <input type="text" id="csc" name="csc" class="form-control" required autocomplete="cc-csc">
        </div>
      </div>
    </fieldset>

    <!-- Billing Address -->
    <fieldset class="mb-4">
      <legend>Billing Address</legend>
      <div class="row g-3">
        <div class="col-12">
          <label for="billing-street" class="form-label">Street Address</label>
          <input type="text" id="billing-street" name="billing-street" class="form-control" required autocomplete="address-line1">
        </div>
        <div class="col-12">
          <label for="billing-line2" class="form-label">Address Line 2</label>
          <input type="text" id="billing-line2" name="billing-line2" class="form-control" autocomplete="address-line2">
        </div>
        <div class="col-md-6">
          <label for="billing-city" class="form-label">City</label>
          <input type="text" id="billing-city" name="billing-city" class="form-control" required autocomplete="address-level2">
        </div>
        <div class="col-md-3">
          <label for="billing-state" class="form-label">State</label>
          <select id="billing-state" name="billing-state" class="form-select" required autocomplete="address-level1">
            <option value="" selected disabled>Choose...</option>
            <option value="MO">MO</option>
            <option value="IL">IL</option>
          </select>
        </div>
        <div class="col-md-3">
          <label for="billing-zip" class="form-label">Zip Code</label>
          <input type="text" id="billing-zip" name="billing-zip" class="form-control" required autocomplete="postal-code">
        </div>
      </div>
    </fieldset>

    <!-- Shipping Address -->
    <fieldset class="mb-4">
      <legend>Shipping Address</legend>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="same-address" name="same-address">
        <label class="form-check-label" for="same-address">Same as billing address?</label>
      </div>

      <div class="row g-3">
        <div class="col-12">
          <label for="shipping-street" class="form-label">Street Address</label>
          <input type="text" id="shipping-street" name="shipping-street" class="form-control" required autocomplete="address-line1">
        </div>
        <div class="col-12">
          <label for="shipping-line2" class="form-label">Address Line 2</label>
          <input type="text" id="shipping-line2" name="shipping-line2" class="form-control" autocomplete="address-line2">
        </div>
        <div class="col-md-6">
          <label for="shipping-city" class="form-label">City</label>
          <input type="text" id="shipping-city" name="shipping-city" class="form-control" required autocomplete="address-level2">
        </div>
        <div class="col-md-3">
          <label for="shipping-state" class="form-label">State</label>
          <select id="shipping-state" name="shipping-state" class="form-select" required autocomplete="address-level1">
            <option value="" selected disabled>Choose...</option>
            <option value="MO">MO</option>
            <option value="IL">IL</option>
          </select>
        </div>
        <div class="col-md-3">
          <label for="shipping-zip" class="form-label">Zip Code</label>
          <input type="text" id="shipping-zip" name="shipping-zip" class="form-control" required autocomplete="postal-code">
        </div>
      </div>
    </fieldset>

    <!-- Submit Button -->
    <div class="text-center mt-4">
      <button type="submit" class="btn btn-primary">Submit Order</button>
    </div>

  </form>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
