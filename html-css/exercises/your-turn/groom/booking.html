<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Appointment - Fluffy's Grooming</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon.png">
</head>

<body>
  <header>
    <h1>Fluffy's Grooming</h1>
    <h2>Book Your Appointment</h2>
  </header>

  <nav>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li><a href="services.html">Services</a></li>
    <li><a href="booking.html">Book Now</a></li>
    <li><a href="groomers.html">Groomers</a></li>
  </ul>
</nav>


  <main>
    <!-- Booking Form -->
    <section class="form-section">
      <h2>Book a Grooming Appointment</h2>
      <form action="#" method="post" class="booking-form">
        <fieldset>
          <legend>Pet Owner Info</legend>
          <label for="owner-name">Full Name:</label>
          <input type="text" id="owner-name" name="owner-name" required>

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>

          <label for="phone">Phone:</label>
          <input type="tel" id="phone" name="phone">
        </fieldset>

        <fieldset>
          <legend>Pet Details</legend>
          <label for="pet-name">Pet's Name:</label>
          <input type="text" id="pet-name" name="pet-name" required>

          <label for="service">Service:</label>
          <select id="service" name="service">
            <option value="small">Small Dog Grooming</option>
            <option value="medium">Medium Dog Grooming</option>
            <option value="large">Large Dog Grooming</option>
            <option value="nail">Nail Trim</option>
            <option value="bath">Bath & Brush</option>
            <option value="shed">De-shedding</option>
          </select>

          <label for="notes">Special Notes:</label>
          <textarea id="notes" name="notes" rows="4"></textarea>
        </fieldset>

        <button type="submit">Submit Appointment</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Fluffy's Grooming. All rights reserved.</p>
  </footer>
</body>
</html>
